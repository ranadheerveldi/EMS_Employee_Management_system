{% extends "base.html" %} {% block content %}

<div class="card">
  <div class="card-header">
    <h3>Add Employee</h3>
  </div>

  <div class="card-body">
    <form action="{{ url_for('employee.employeeAdd') }}" method="POST">
        <div class="mb-3">
            <label>Name : </label>
            <input type="text" name="name" class="form-control px-4" required>
        </div>

        <div class="mb-3">
            <label>Email : </label>
            <input type="email" name="email" class="form-control px-4" required>
        </div>

        <div class="mb-3">
            <label>Password : </label>
            <input type="text" name="password" class="form-control px-4" required>
        </div>

        <div class="mb-3">
            <label>Salary : </label>
            <input type="text" name="salary" class="form-control px-4" required>
        </div>
        <div class="mb-3">
            <label>Department : </label>
            <input type="text" name="department" class="form-control px-4" required>
        </div>

        <button type="submit" class="btn btn-success"><i class="bi bi-person-plus"></i> Submit</button>
        <button type="reset" class="btn btn-primary"><i class="bi bi-arrow-counterclockwise"></i> Reset</button>
    </form>
  </div>
</div>

{% endblock %}

{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <h1 class="mb-4">Department Page</h1>

    {% if departments %}
        <ul class="list-group">
            {% for department in departments %}
                <li class="list-group-item">{{ department }}</li>
            {% endfor %}
        </ul>
    {% else %}
        <div class="alert alert-info">No departments found yet.</div>
    {% endif %}
</div>
{% endblock %}
